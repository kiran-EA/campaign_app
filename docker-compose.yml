version: '3.8'

services:
  bluecore-app:
    build: .
    container_name: bluecore_campaign_app
    ports:
      - "5000:5000"
    volumes:
      - ./app.py:/app/app.py
      - ./templates:/app/templates
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: unless-stopped
